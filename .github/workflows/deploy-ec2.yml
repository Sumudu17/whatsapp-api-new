name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-ec2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -euo pipefail

            PROJECT_PATH="${{ secrets.EC2_PROJECT_PATH }}"
            echo "📁 Project path: $PROJECT_PATH"

            if [ ! -d "$PROJECT_PATH" ]; then
              echo "❌ Project folder not found: $PROJECT_PATH"
              exit 1
            fi

            cd "$PROJECT_PATH"

            if [ ! -d ".git" ]; then
              echo "❌ This folder is not a git repository (missing .git): $PROJECT_PATH"
              exit 1
            fi

            echo "🔧 Fixing ownership for git operations..."
            sudo chown -R "${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }}" "$PROJECT_PATH" || true

            echo "🔧 Marking safe.directory..."
            git config --global --add safe.directory "$PROJECT_PATH" || true

            echo "📥 Pulling latest code from GitHub..."
            git fetch origin
            git reset --hard origin/main || git reset --hard origin/master

            echo "📦 Checking Node.js installation..."
            if ! command -v node >/dev/null 2>&1; then
              echo "⚠️ Node.js not found. Installing Node.js 18.x..."
              curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            echo "✅ Node: $(node --version) | ✅ npm: $(npm --version)"

            echo "🔧 Installing Chrome dependencies for Puppeteer..."
            sudo apt-get update
            sudo apt-get install -y libcups2t64 libasound2t64 libnss3 libxss1 libxrandr2 libxcomposite1 libxdamage1 libxfixes3 libgbm1 libdrm2 libxkbcommon0 libpangocairo-1.0-0 libpango-1.0-0 libgtk-3-0t64 fonts-liberation xdg-utils ca-certificates || \
            sudo apt-get install -y ca-certificates fonts-liberation libappindicator3-1 libasound2 libatk-bridge2.0-0 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libgcc1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 lsb-release wget xdg-utils

            echo "⚙️ Configuring .env file..."
            if [ ! -f "$PROJECT_PATH/.env" ]; then
              echo "📝 Creating .env from .env.example..."
              if [ -f "$PROJECT_PATH/.env.example" ]; then
                cp "$PROJECT_PATH/.env.example" "$PROJECT_PATH/.env"
                echo "⚠️ Please update .env with your actual credentials"
              else
                touch "$PROJECT_PATH/.env"
              fi
            fi
            
            # Ensure proper ownership of .env file
            sudo chown "${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }}" "$PROJECT_PATH/.env" || true

            echo "📦 Installing npm dependencies..."
            if [ -f "$PROJECT_PATH/package.json" ]; then
              # Filter out deprecation warnings from transitive dependencies (harmless but noisy)
              { npm ci --no-audit --no-fund 2>&1 || npm install --no-audit --no-fund 2>&1; } | \
              sed '/^npm warn deprecated/d' || true
            else
              echo "❌ package.json not found in $PROJECT_PATH"
              exit 1
            fi

            echo "🔨 Building TypeScript..."
            npm run build || echo "⚠️ Build failed, continuing anyway..."

            echo "🐳 Checking Docker (required for Flyway)..."
            if ! command -v docker >/dev/null 2>&1; then
              echo "⚠️ Docker not found. Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo systemctl enable --now docker
            fi
            if ! sudo systemctl is-active --quiet docker 2>/dev/null; then
              echo "⚠️ Docker not running. Starting Docker..."
              sudo systemctl start docker || true
            fi

            if [ -f "$PROJECT_PATH/run-flyway.sh" ]; then
              echo "🔧 Making run-flyway.sh executable..."
              sudo chmod +x "$PROJECT_PATH/run-flyway.sh"
              echo "🗄️ Running database migrations with Flyway..."
              cd "$PROJECT_PATH"
              sudo bash run-flyway.sh migrate
              echo "📊 Migration status:"
              sudo bash run-flyway.sh info
            else
              echo "❌ run-flyway.sh not found at $PROJECT_PATH/run-flyway.sh"
              exit 1
            fi

            echo "🔄 Restarting app..."

            echo "🔄 Restarting systemd service..."
            # Build one more time right before restart to ensure dist matches the latest code.
            # (Migrations run via Docker do not affect dist, but this keeps deployment deterministic.)
            npm run build || echo "⚠️ Final build failed, continuing anyway..."
            sudo systemctl daemon-reload
            sudo systemctl enable wa-api-3004 || true
            sudo systemctl restart wa-api-3004 || echo "⚠️ Service restart failed, service may not exist yet"
            sudo systemctl status wa-api-3004 --no-pager || echo "⚠️ Service status unavailable"

            echo "✅ Deployment completed successfully!"
