name: Deploy WhatsApp API

on:
  push:
    branches:
      - feature/add-whatsapp-media-message-support
      - main

  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # TESTING DEPLOYMENT
  # Branch: add-whatsapp-media-message-support
  # Server: Contabo
  # GitHub Environment: Testing
  # Authentication: Username + Password
  # ============================================================

  deploy-testing:
    name: Deploy to Contabo Testing
    if: github.ref == 'refs/heads/feature/add-whatsapp-media-message-support'
    runs-on: ubuntu-latest

    environment:
      name: Testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Contabo Testing Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}

          script: |
            set -euo pipefail

            PROJECT_PATH="${{ secrets.PROJECT_PATH }}"
            DEPLOY_BRANCH="feature/add-whatsapp-media-message-support"
            PASSWORD="${{ secrets.PASSWORD }}"

            echo "=========================================="
            echo "🧪 TESTING DEPLOYMENT"
            echo "🖥️ Server: Contabo"
            echo "🌿 Branch: $DEPLOY_BRANCH"
            echo "📁 Project: $PROJECT_PATH"
            echo "=========================================="

            # --------------------------------------------------
            # Check project
            # --------------------------------------------------

            if [ ! -d "$PROJECT_PATH" ]; then
              echo "❌ Project folder not found: $PROJECT_PATH"
              exit 1
            fi

            cd "$PROJECT_PATH"

            if [ ! -d ".git" ]; then
              echo "❌ This folder is not a Git repository:"
              echo "$PROJECT_PATH"
              exit 1
            fi

            echo "🔧 Marking project as Git safe.directory..."
            git config --global --add safe.directory "$PROJECT_PATH" || true


            # --------------------------------------------------
            # Pull latest TESTING code
            # --------------------------------------------------

            echo "📥 Fetching latest code from GitHub..."
            git fetch origin

            echo "🌿 Switching to testing branch..."

            git checkout "$DEPLOY_BRANCH" || \
              git checkout -b "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"

            echo "🔄 Updating testing code..."
            git reset --hard "origin/$DEPLOY_BRANCH"

            echo "✅ Current commit:"
            git log -1 --oneline


            # --------------------------------------------------
            # Node.js
            # --------------------------------------------------

            echo "📦 Checking Node.js installation..."

            if ! command -v node >/dev/null 2>&1; then
              echo "⚠️ Node.js not found. Installing Node.js 18.x..."

              echo "$PASSWORD" | sudo -S -E bash -c "$(curl -fsSL https://deb.nodesource.com/setup_18.x)"

              echo "$PASSWORD" | sudo -S apt-get install -y nodejs
            fi

            echo "✅ Node: $(node --version)"
            echo "✅ npm: $(npm --version)"


            # --------------------------------------------------
            # Puppeteer / Chrome dependencies
            # --------------------------------------------------

            echo "🔧 Installing Chrome dependencies for Puppeteer..."

            echo "$PASSWORD" | sudo -S apt-get update

            echo "$PASSWORD" | sudo -S apt-get install -y \
              libcups2t64 \
              libasound2t64 \
              libnss3 \
              libxss1 \
              libxrandr2 \
              libxcomposite1 \
              libxdamage1 \
              libxfixes3 \
              libgbm1 \
              libdrm2 \
              libxkbcommon0 \
              libpangocairo-1.0-0 \
              libpango-1.0-0 \
              libgtk-3-0t64 \
              fonts-liberation \
              xdg-utils \
              ca-certificates || \
            echo "$PASSWORD" | sudo -S apt-get install -y \
              ca-certificates \
              fonts-liberation \
              libappindicator3-1 \
              libasound2 \
              libatk-bridge2.0-0 \
              libatk1.0-0 \
              libc6 \
              libcairo2 \
              libcups2 \
              libdbus-1-3 \
              libexpat1 \
              libfontconfig1 \
              libgbm1 \
              libgcc1 \
              libglib2.0-0 \
              libgtk-3-0 \
              libnspr4 \
              libnss3 \
              libpango-1.0-0 \
              libpangocairo-1.0-0 \
              libstdc++6 \
              libx11-6 \
              libx11-xcb1 \
              libxcb1 \
              libxcomposite1 \
              libxcursor1 \
              libxdamage1 \
              libxext6 \
              libxfixes3 \
              libxi6 \
              libxrandr2 \
              libxrender1 \
              libxss1 \
              libxtst6 \
              lsb-release \
              wget \
              xdg-utils


            # --------------------------------------------------
            # .env
            # --------------------------------------------------

            echo "⚙️ Checking .env file..."

            if [ ! -f "$PROJECT_PATH/.env" ]; then

              if [ -f "$PROJECT_PATH/.env.example" ]; then
                echo "📝 Creating .env from .env.example..."
                cp "$PROJECT_PATH/.env.example" "$PROJECT_PATH/.env"
              else
                echo "📝 Creating empty .env..."
                touch "$PROJECT_PATH/.env"
              fi

              echo "⚠️ Make sure Testing .env contains Testing credentials."
            fi


            # --------------------------------------------------
            # npm dependencies
            # --------------------------------------------------

            echo "📦 Installing npm dependencies..."

            if [ ! -f "$PROJECT_PATH/package.json" ]; then
              echo "❌ package.json not found"
              exit 1
            fi

            npm ci --no-audit --no-fund


            # --------------------------------------------------
            # Build
            # --------------------------------------------------

            echo "🔨 Building TypeScript application..."

            npm run build

            echo "✅ Build completed successfully"


            # --------------------------------------------------
            # Docker
            # --------------------------------------------------

            echo "🐳 Checking Docker..."

            if ! command -v docker >/dev/null 2>&1; then
              echo "⚠️ Docker not found. Installing Docker..."

              echo "$PASSWORD" | sudo -S apt-get update
              echo "$PASSWORD" | sudo -S apt-get install -y docker.io

              echo "$PASSWORD" | sudo -S systemctl enable --now docker
            fi

            if ! echo "$PASSWORD" | sudo -S systemctl is-active --quiet docker; then
              echo "🔄 Starting Docker..."
              echo "$PASSWORD" | sudo -S systemctl start docker
            fi


            # --------------------------------------------------
            # Flyway TEST database
            # --------------------------------------------------

            if [ -f "$PROJECT_PATH/run-flyway.sh" ]; then

              echo "🔧 Making run-flyway.sh executable..."
              echo "$PASSWORD" | sudo -S chmod +x "$PROJECT_PATH/run-flyway.sh"

              echo "🗄️ Running TEST database migrations..."
              echo "$PASSWORD" | sudo -S bash "$PROJECT_PATH/run-flyway.sh" migrate

              echo "📊 Flyway migration status..."
              echo "$PASSWORD" | sudo -S bash "$PROJECT_PATH/run-flyway.sh" info

            else
              echo "❌ run-flyway.sh not found:"
              echo "$PROJECT_PATH/run-flyway.sh"
              exit 1
            fi


            # --------------------------------------------------
            # Restart TEST application
            # --------------------------------------------------

            echo "🔄 Restarting Testing application..."

            echo "$PASSWORD" | sudo -S systemctl daemon-reload

            echo "$PASSWORD" | sudo -S systemctl enable wa-api-3004 || true

            echo "$PASSWORD" | sudo -S systemctl restart wa-api-3004

            echo "📊 Testing service status:"

            echo "$PASSWORD" | sudo -S systemctl status wa-api-3004 \
              --no-pager \
              --lines=20

            echo "=========================================="
            echo "✅ TESTING DEPLOYMENT COMPLETED"
            echo "🖥️ Server: Contabo"
            echo "🌿 Branch: $DEPLOY_BRANCH"
            echo "=========================================="


  # ============================================================
  # PRODUCTION DEPLOYMENT
  # Branch: main
  # Server: AWS
  # GitHub Environment: Production
  # Authentication: SSH Key
  # ============================================================

  deploy-production:
    name: Deploy to AWS Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AWS Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}

          script: |
            set -euo pipefail

            PROJECT_PATH="${{ secrets.PROJECT_PATH }}"
            DEPLOY_BRANCH="main"

            echo "=========================================="
            echo "🚀 PRODUCTION DEPLOYMENT"
            echo "☁️ Server: AWS"
            echo "🌿 Branch: $DEPLOY_BRANCH"
            echo "📁 Project: $PROJECT_PATH"
            echo "=========================================="

            # --------------------------------------------------
            # Check project
            # --------------------------------------------------

            if [ ! -d "$PROJECT_PATH" ]; then
              echo "❌ Project folder not found: $PROJECT_PATH"
              exit 1
            fi

            cd "$PROJECT_PATH"

            if [ ! -d ".git" ]; then
              echo "❌ This folder is not a Git repository:"
              echo "$PROJECT_PATH"
              exit 1
            fi


            # --------------------------------------------------
            # Permissions
            # --------------------------------------------------

            echo "🔧 Fixing project ownership..."

            sudo chown -R \
              "${{ secrets.USER }}:${{ secrets.USER }}" \
              "$PROJECT_PATH" || true

            echo "🔧 Marking project as Git safe.directory..."

            git config --global \
              --add safe.directory \
              "$PROJECT_PATH" || true


            # --------------------------------------------------
            # Pull latest PRODUCTION code
            # --------------------------------------------------

            echo "📥 Fetching latest production code..."

            git fetch origin

            echo "🌿 Switching to main..."

            git checkout main || \
              git checkout -b main origin/main

            echo "🔄 Updating production code..."

            git reset --hard origin/main

            echo "✅ Current production commit:"
            git log -1 --oneline


            # --------------------------------------------------
            # Node.js
            # --------------------------------------------------

            echo "📦 Checking Node.js installation..."

            if ! command -v node >/dev/null 2>&1; then
              echo "⚠️ Node.js not found. Installing Node.js 18.x..."

              curl -fsSL https://deb.nodesource.com/setup_18.x | \
                sudo -E bash -

              sudo apt-get install -y nodejs
            fi

            echo "✅ Node: $(node --version)"
            echo "✅ npm: $(npm --version)"


            # --------------------------------------------------
            # Puppeteer / Chrome dependencies
            # --------------------------------------------------

            echo "🔧 Installing Chrome dependencies for Puppeteer..."

            sudo apt-get update

            sudo apt-get install -y \
              libcups2t64 \
              libasound2t64 \
              libnss3 \
              libxss1 \
              libxrandr2 \
              libxcomposite1 \
              libxdamage1 \
              libxfixes3 \
              libgbm1 \
              libdrm2 \
              libxkbcommon0 \
              libpangocairo-1.0-0 \
              libpango-1.0-0 \
              libgtk-3-0t64 \
              fonts-liberation \
              xdg-utils \
              ca-certificates || \
            sudo apt-get install -y \
              ca-certificates \
              fonts-liberation \
              libappindicator3-1 \
              libasound2 \
              libatk-bridge2.0-0 \
              libatk1.0-0 \
              libc6 \
              libcairo2 \
              libcups2 \
              libdbus-1-3 \
              libexpat1 \
              libfontconfig1 \
              libgbm1 \
              libgcc1 \
              libglib2.0-0 \
              libgtk-3-0 \
              libnspr4 \
              libnss3 \
              libpango-1.0-0 \
              libpangocairo-1.0-0 \
              libstdc++6 \
              libx11-6 \
              libx11-xcb1 \
              libxcb1 \
              libxcomposite1 \
              libxcursor1 \
              libxdamage1 \
              libxext6 \
              libxfixes3 \
              libxi6 \
              libxrandr2 \
              libxrender1 \
              libxss1 \
              libxtst6 \
              lsb-release \
              wget \
              xdg-utils


            # --------------------------------------------------
            # .env
            # --------------------------------------------------

            echo "⚙️ Checking production .env file..."

            if [ ! -f "$PROJECT_PATH/.env" ]; then

              if [ -f "$PROJECT_PATH/.env.example" ]; then
                echo "📝 Creating .env from .env.example..."
                cp "$PROJECT_PATH/.env.example" "$PROJECT_PATH/.env"
              else
                echo "📝 Creating empty .env..."
                touch "$PROJECT_PATH/.env"
              fi

              echo "⚠️ Make sure Production .env contains Production credentials."
            fi

            sudo chown \
              "${{ secrets.USER }}:${{ secrets.USER }}" \
              "$PROJECT_PATH/.env" || true


            # --------------------------------------------------
            # npm dependencies
            # --------------------------------------------------

            echo "📦 Installing npm dependencies..."

            if [ ! -f "$PROJECT_PATH/package.json" ]; then
              echo "❌ package.json not found"
              exit 1
            fi

            npm ci --no-audit --no-fund


            # --------------------------------------------------
            # Build
            # --------------------------------------------------

            echo "🔨 Building TypeScript application..."

            npm run build

            echo "✅ Production build completed successfully"


            # --------------------------------------------------
            # Docker
            # --------------------------------------------------

            echo "🐳 Checking Docker..."

            if ! command -v docker >/dev/null 2>&1; then
              echo "⚠️ Docker not found. Installing Docker..."

              sudo apt-get update
              sudo apt-get install -y docker.io

              sudo systemctl enable --now docker
            fi

            if ! sudo systemctl is-active --quiet docker; then
              echo "🔄 Starting Docker..."
              sudo systemctl start docker
            fi


            # --------------------------------------------------
            # Flyway PRODUCTION database
            # --------------------------------------------------

            if [ -f "$PROJECT_PATH/run-flyway.sh" ]; then

              echo "🔧 Making run-flyway.sh executable..."
              sudo chmod +x "$PROJECT_PATH/run-flyway.sh"

              echo "🗄️ Running PRODUCTION database migrations..."
              sudo bash "$PROJECT_PATH/run-flyway.sh" migrate

              echo "📊 Flyway migration status..."
              sudo bash "$PROJECT_PATH/run-flyway.sh" info

            else
              echo "❌ run-flyway.sh not found:"
              echo "$PROJECT_PATH/run-flyway.sh"
              exit 1
            fi


            # --------------------------------------------------
            # Restart PRODUCTION application
            # --------------------------------------------------

            echo "🔄 Restarting Production application..."

            sudo systemctl daemon-reload

            sudo systemctl enable wa-api-3004 || true

            sudo systemctl restart wa-api-3004

            echo "📊 Production service status:"

            sudo systemctl status wa-api-3004 \
              --no-pager \
              --lines=20

            echo "=========================================="
            echo "✅ PRODUCTION DEPLOYMENT COMPLETED"
            echo "☁️ Server: AWS"
            echo "🌿 Branch: main"
            echo "=========================================="