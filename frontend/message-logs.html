<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Logs</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .logs-table-wrap {
        overflow-x: auto;
        width: 100%;
      }
      /* Match other pages' `.container { margin: 24px auto 40px; }` spacing */
      .logs-container {
        margin: 24px auto 40px;
      }
      table.logs-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        font-family: Arial, Helvetica, sans-serif;
      }
      #logsTableCard {
        width: 100%;
      }
      table.logs-table th,
      table.logs-table td {
        border: 1px solid #e2e5eb;
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
      }
      table.logs-table th {
        background: #f0f2f5;
        font-weight: 600;
      }
      table.logs-table tr:nth-child(even) {
        background: #fafbfc;
      }
      .cell-mono {
        font-family: ui-monospace, monospace;
        font-size: 13px;
        word-break: break-all;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
      }
      .badge-text {
        background: #e6f4ea;
        color: #1e7e34;
      }
      .badge-poll {
        background: #e7f0ff;
        color: #2b57d6;
      }
      .logs-pagination {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body class="has-app-shell" data-page="message-logs">
    <div id="navMount"></div>
    <div class="page-wrap">
      <main class="page-main">
        <div class="container-fluid px-5 logs-container">
          <header class="header">
            <div>
              <h1>Message Logs</h1>
            </div>
          </header>

          <p class="info" style="margin-top: 0">
            All messages sent from your account.
          </p>

          <p id="logsError" class="error hidden"></p>
          <div id="logsLoading" class="info">Loading…</div>
          <p id="logsEmpty" class="hidden">No messages sent yet.</p>

          <div class="card logs-table-wrap hidden" id="logsTableCard">
            <div class="logs-table-wrap">
              <table class="logs-table" id="logsTable">
                <thead>
                  <tr>
                    <th>Sent At</th>
                    <th>Type</th>
                    <th>Destination</th>
                    <th>WhatsApp Message ID</th>
                  </tr>
                </thead>
                <tbody id="logsTbody"></tbody>
              </table>
            </div>
          </div>

          <div class="logs-pagination hidden" id="logsPagination">
            <button id="logsPrevBtn" class="btn btn-secondary btn-sm" type="button">Previous</button>
            <span id="logsPageText" class="info" style="margin: 0;"></span>
            <button id="logsNextBtn" class="btn btn-secondary btn-sm" type="button">Next</button>
          </div>
        </div>
      </main>
      <div id="footerMount"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/nav.js"></script>
    <script>
      const request = async (url, options = {}) => {
        const res = await fetch(url, {
          ...options,
          cache: "no-store",
          credentials: "include",
          headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          window.location.href = "/login";
          const err = new Error("Unauthorized");
          /** @type {any} */ (err).status = 401;
          throw err;
        }
        if (!res.ok) {
          const err = new Error(data.error || "Request failed");
          /** @type {any} */ (err).status = res.status;
          throw err;
        }
        return data;
      };

      const esc = (s) => {
        const d = document.createElement("div");
        d.textContent = s == null ? "" : String(s);
        return d.innerHTML;
      };

      const typeBadgeClass = (t) => (t === "poll" ? "badge-poll" : "badge-text");

      const formatSentAt = (value) => {
        if (value == null || value === "") return "—";
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return String(value);
        return d.toLocaleString(undefined, {
          year: "numeric",
          month: "short",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
      };

      const errEl = document.getElementById("logsError");
      const loadingEl = document.getElementById("logsLoading");
      const emptyEl = document.getElementById("logsEmpty");
      const tableCard = document.getElementById("logsTableCard");
      const tbody = document.getElementById("logsTbody");
      const paginationEl = document.getElementById("logsPagination");
      const prevBtn = document.getElementById("logsPrevBtn");
      const nextBtn = document.getElementById("logsNextBtn");
      const pageText = document.getElementById("logsPageText");

      let currentPage = 1;

      const loadLogs = async (page) => {
        errEl.classList.add("hidden");
        emptyEl.classList.add("hidden");
        tableCard.classList.add("hidden");
        paginationEl.classList.add("hidden");
        loadingEl.classList.remove("hidden");

        try {
          const data = await request(`/api/whatsapp/message-logs?page=${page}`);
          loadingEl.classList.add("hidden");

          const logs = data.logs || [];
          currentPage = data.page || page;

          if (!logs.length) {
            emptyEl.classList.remove("hidden");
            return;
          }

          tbody.innerHTML = logs
            .map(
              (l) => `<tr>
                <td>${esc(formatSentAt(l.sentAt))}</td>
                <td><span class="badge ${typeBadgeClass(l.messageType)}">${esc(l.messageType)}</span></td>
                <td class="cell-mono">${esc(l.destination)}</td>
                <td class="cell-mono">${esc(l.whatsappMessageId || "—")}</td>
              </tr>`
            )
            .join("");
          tableCard.classList.remove("hidden");

          const totalPages = data.totalPages || 1;
          pageText.textContent = `Page ${currentPage} of ${totalPages}`;
          prevBtn.disabled = currentPage <= 1;
          nextBtn.disabled = currentPage >= totalPages;
          paginationEl.classList.remove("hidden");
        } catch (e) {
          loadingEl.classList.add("hidden");
          errEl.textContent = e.message || "Failed to load message logs";
          errEl.classList.remove("hidden");
        }
      };

      prevBtn.addEventListener("click", () => {
        if (currentPage > 1) loadLogs(currentPage - 1);
      });

      nextBtn.addEventListener("click", () => {
        loadLogs(currentPage + 1);
      });

      (async () => {
        await loadLogs(1);
      })();
    </script>
  </body>
</html>
