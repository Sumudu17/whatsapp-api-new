<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Web - Verify Email</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="has-app-shell" data-page="verify-email">
    <div id="navMount"></div>
    <div class="page-wrap">
      <main class="page-main">
        <div class="container">
      <h1>Verify Email</h1>
      <form id="verifyForm" class="card">
        <p id="emailHint" class="info hidden"></p>
        <label class="form-label">
          OTP Code
          <input type="text" id="otp" required maxlength="6" class="form-control" />
        </label>
        <button type="submit" class="btn btn-primary">Verify</button>
        <button id="resendBtn" class="btn btn-secondary mt-2" type="button">
          Resend OTP
        </button>
        <p id="verifyError" class="error hidden"></p>
        <p id="verifySuccess" class="info hidden"></p>
      </form>
        </div>
      </main>
      <div id="footerMount"></div>
    </div>

    <script>
      const url = new URL(window.location.href);
      const email = url.searchParams.get("email");

      const emailHint = document.getElementById("emailHint");
      const verifyForm = document.getElementById("verifyForm");
      const errorEl = document.getElementById("verifyError");
      const successEl = document.getElementById("verifySuccess");
      const otpInput = document.getElementById("otp");
      const resendBtn = document.getElementById("resendBtn");

      if (!email) {
        errorEl.textContent = "Missing email in URL.";
        errorEl.classList.remove("hidden");
        verifyForm.querySelector("button[type='submit']").disabled = true;
        resendBtn.disabled = true;
      } else {
        emailHint.textContent = `Enter the OTP sent to: ${email}`;
        emailHint.classList.remove("hidden");
      }

      const setError = (msg) => {
        errorEl.textContent = msg;
        errorEl.classList.remove("hidden");
      };

      const setSuccess = (msg) => {
        successEl.textContent = msg;
        successEl.classList.remove("hidden");
      };

      verifyForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.classList.add("hidden");
        successEl.classList.add("hidden");

        const otp = otpInput.value.trim();
        const res = await fetch("/api/auth/verify-email-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, otp }),
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          setError(data.error || "OTP verification failed");
          return;
        }

        window.location.href = "/login";
      });

      resendBtn.addEventListener("click", async () => {
        errorEl.classList.add("hidden");
        successEl.classList.add("hidden");

        const res = await fetch("/api/auth/resend-email-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          setError(data.error || "Failed to resend OTP");
          return;
        }
        setSuccess("A new OTP has been sent.");
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/nav.js"></script>
  </body>
</html>
