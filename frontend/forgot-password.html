<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Web - Forgot password</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="has-app-shell" data-page="forgot-password">
    <div id="navMount"></div>
    <div class="page-wrap">
      <main class="page-main">
        <div class="container">
      <h1>Forgot password</h1>
      <p class="info">
        Enter your account email. If it matches an active account, we will send a 6-digit code.
      </p>
      <form id="form" class="card">
        <label class="form-label">
          Email
          <input type="email" id="email" required autocomplete="email" class="form-control" />
        </label>
        <button type="submit" class="btn btn-primary">Send reset code</button>
        <button type="button" class="btn btn-secondary mt-2" id="resendBtn">Send again</button>
        <p id="msg" class="info hidden"></p>
        <p id="err" class="error hidden"></p>
        <p class="info" style="margin-top: 12px;">
          <a id="nextLink" href="/reset-password" class="hidden">Enter code and new password →</a>
        </p>
        <p class="info"><a href="/login">Back to login</a></p>
      </form>
        </div>
      </main>
      <div id="footerMount"></div>
    </div>

    <script>
      const form = document.getElementById("form");
      const emailInput = document.getElementById("email");
      const msgEl = document.getElementById("msg");
      const errEl = document.getElementById("err");
      const resendBtn = document.getElementById("resendBtn");
      const nextLink = document.getElementById("nextLink");

      const showMsg = (text) => {
        msgEl.textContent = text;
        msgEl.classList.remove("hidden");
        errEl.classList.add("hidden");
      };

      const showErr = (text) => {
        errEl.textContent = text;
        errEl.classList.remove("hidden");
      };

      const postForgot = async () => {
        errEl.classList.add("hidden");
        msgEl.classList.add("hidden");
        const email = emailInput.value.trim();
        const res = await fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showErr(data.error || "Request failed");
          return;
        }
        showMsg(data.message || "If an account exists for that email, a reset code will be sent shortly.");
        nextLink.href = `/reset-password?email=${encodeURIComponent(email)}`;
        nextLink.classList.remove("hidden");
      };

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        await postForgot();
      });

      resendBtn.addEventListener("click", async () => {
        await postForgot();
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/nav.js"></script>
  </body>
</html>
