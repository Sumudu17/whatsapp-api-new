<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Web - Register</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="has-app-shell" data-page="register">
    <div id="navMount"></div>
    <div class="page-wrap">
      <main class="page-main">
        <div class="container">
      <h1>Register</h1>
      <form id="registerForm" class="card">
        <label class="form-label">
          Name
          <input type="text" id="name" required maxlength="100" class="form-control" />
        </label>
        <label class="form-label">
          Email
          <input type="email" id="email" required class="form-control" />
        </label>
        <label class="form-label">
          Password
          <input type="password" id="password" required minlength="8" class="form-control" />
        </label>
        <button type="submit" class="btn btn-primary">Register</button>
        <p id="registerError" class="error hidden"></p>
      </form>
        </div>
      </main>
      <div id="footerMount"></div>
    </div>

    <script>
      const form = document.getElementById("registerForm");
      const errorEl = document.getElementById("registerError");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.classList.add("hidden");

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password }),
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          errorEl.textContent = data.error || "Registration failed";
          errorEl.classList.remove("hidden");
          return;
        }

        window.location.href = `/verify-email?email=${encodeURIComponent(email)}`;
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/nav.js"></script>
  </body>
</html>
