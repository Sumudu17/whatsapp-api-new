<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Web - Admin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      .admin-table-wrap {
        overflow-x: auto;
        width: 100%;
      }
      /* Match other pages' `.container { margin: 24px auto 40px; }` spacing */
      .admin-container {
        margin: 24px auto 40px;
      }
      table.admin-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        font-family: Arial, Helvetica, sans-serif;
      }
      #adminTableCard {
        width: 100%;
      }
      table.admin-table th,
      table.admin-table td {
        border: 1px solid #e2e5eb;
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
      }
      table.admin-table th {
        background: #f0f2f5;
        font-weight: 600;
      }
      table.admin-table tr:nth-child(even) {
        background: #fafbfc;
      }
      .cell-mono {
        font-family: inherit;
        font-size: 14px;
        word-break: break-word;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
      }
      .badge-ok {
        background: #e6f4ea;
        color: #1e7e34;
      }
      .badge-warn {
        background: #fff3cd;
        color: #856404;
      }
      .badge-muted {
        background: #e9ecef;
        color: #495057;
      }
    </style>
  </head>
  <body class="has-app-shell" data-page="admin">
    <div id="navMount"></div>
    <div class="page-wrap">
      <main class="page-main">
        <div class="container-fluid px-5 admin-container">
          <header class="header">
            <div>
              <h1>Admin</h1>
            </div>
          </header>

          <div class="mt-2">
            <span id="versionText" class="version-badge">v1.0.0</span>
          </div>

          <p class="info" style="margin-top: 0">
            Accounts and WhatsApp session status.
          </p>

          <p id="adminError" class="error hidden"></p>
          <div id="adminLoading" class="info">Loading…</div>

          <div class="card admin-table-wrap hidden" id="adminTableCard">
            <div class="admin-table-wrap">
              <table class="admin-table" id="adminTable">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Active</th>
                    <th>Live WA</th>
                    <th>DB WA</th>
                    <th>Client Phone</th>
                    <th>Last error (live)</th>
                    <th>Last disconnect (DB)</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="adminTbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
      <div id="footerMount"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/nav.js"></script>
    <script>
      const request = async (url, options = {}) => {
        const res = await fetch(url, {
          ...options,
          cache: "no-store",
          credentials: "include",
          headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          // Session expired or cookie not present: send user back to login.
          window.location.href = "/login";
          const err = new Error("Unauthorized");
          /** @type {any} */ (err).status = 401;
          throw err;
        }
        if (!res.ok) {
          const err = new Error(data.error || "Request failed");
          /** @type {any} */ (err).status = res.status;
          throw err;
        }
        return data;
      };

      const statusBadgeClass = (s) => {
        if (!s) return "badge-muted";
        if (s === "READY") return "badge-ok";
        if (s === "DISCONNECTED" || s === "NOT_INITIALIZED") return "badge-warn";
        return "badge-muted";
      };

      const esc = (s) => {
        const d = document.createElement("div");
        d.textContent = s == null ? "" : String(s);
        return d.innerHTML;
      };

      const short = (s, max = 120) => {
        if (s == null || s === "") return "—";
        const t = String(s);
        return t.length > max ? t.slice(0, max) + "…" : t;
      };

      const toast = (icon, text, timer = 2200) => {
        return Swal.fire({
          toast: true,
          position: "top-end",
          icon,
          title: text,
          showConfirmButton: false,
          timer,
          timerProgressBar: true,
        });
      };

      const bindDeleteButtons = ({ actorUserId }) => {
        const btns = Array.from(document.querySelectorAll(".admin-delete-user-btn"));
        for (const btn of btns) {
          btn.addEventListener("click", async () => {
            const userId = Number(btn.getAttribute("data-user-id"));
            const email = btn.getAttribute("data-email") || "";
            const name = btn.getAttribute("data-name") || "";

            if (!Number.isFinite(userId) || userId <= 0) return;
            if (actorUserId && userId === actorUserId) {
              await toast("warning", "You cannot delete your own admin account.");
              return;
            }

            const result = await Swal.fire({
              title: "Delete this user?",
              html: `<div style="text-align:left;">
                <div><strong>User ID:</strong> ${esc(userId)}</div>
                <div><strong>Name:</strong> ${esc(name || "—")}</div>
                <div><strong>Email:</strong> ${esc(email || "—")}</div>
                <div class="mt-2">This will permanently delete the user and remove WhatsApp session files from disk.</div>
              </div>`,
              icon: "warning",
              showCancelButton: true,
              confirmButtonText: "Yes, delete",
              cancelButtonText: "Cancel",
              confirmButtonColor: "#dc3545",
              reverseButtons: true,
              focusCancel: true,
            });

            if (!result.isConfirmed) return;

            try {
              await request(`/api/admin/users/${userId}`, { method: "DELETE" });
              await toast("success", "User deleted.");
              await loadAccounts();
            } catch (e) {
              await toast("error", e.message || "Delete failed");
            }
          });
        }
      };

      const getActorUserId = async () => {
        try {
          const me = await request("/api/auth/me");
          return Number(me?.user?.id) || null;
        } catch (_) {
          return null;
        }
      };

      const errEl = document.getElementById("adminError");
      const loadingEl = document.getElementById("adminLoading");
      const tableCard = document.getElementById("adminTableCard");
      const tbody = document.getElementById("adminTbody");
      let actorUserId = null;

      const loadAccounts = async () => {
        errEl.classList.add("hidden");
        tableCard.classList.add("hidden");
        loadingEl.classList.remove("hidden");

        try {
          const data = await request("/api/admin/accounts");
          loadingEl.classList.add("hidden");
          const accounts = data.accounts || [];
          tbody.innerHTML = accounts
            .map((a) => {
              const live = a.liveStatus || "—";
              const db = a.dbStatus || "—";
              return `<tr>
                <td>${a.userId}</td>
                <td>${esc(a.name)}</td>
                <td class="cell-mono">${esc(a.email)}</td>
                <td>${a.isActive ? "Yes" : "No"}</td>
                <td><span class="badge ${statusBadgeClass(a.liveStatus)}">${esc(live)}</span></td>
                <td><span class="badge ${statusBadgeClass(a.dbStatus)}">${esc(db)}</span></td>
                <td class="cell-mono">${esc(a.clientPhoneNumber || "—")}</td>
                <td class="cell-mono">${esc(short(a.liveLastError, 200))}</td>
                <td class="cell-mono">${esc(short(a.lastDisconnectedReason, 200))}</td>
                <td>
                  <button
                    type="button"
                    class="btn btn-danger btn-sm admin-delete-user-btn"
                    data-user-id="${a.userId}"
                    data-email="${esc(a.email)}"
                    data-name="${esc(a.name)}"
                  >
                    Delete
                  </button>
                </td>
              </tr>`;
            })
            .join("");
          tableCard.classList.remove("hidden");
          bindDeleteButtons({ actorUserId });
        } catch (e) {
          loadingEl.classList.add("hidden");
          const st = /** @type {any} */ (e).status;
          errEl.textContent =
            st === 403
              ? "Access denied. Your account is not configured as admin (set ADMIN_EMAIL / ADMIN_EMAILS to your email in .env)."
              : e.message || "Failed to load";
          errEl.classList.remove("hidden");
        }

        return undefined;
      };

      (async () => {
        try {
          const v = await request("/api/version");
          if (v?.version) {
            const el = document.getElementById("versionText");
            if (el) el.textContent = `v${v.version}`;
          }
        } catch (_) {}

        actorUserId = await getActorUserId();
        await loadAccounts();
      })();
    </script>
  </body>
</html>
