<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Web Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="has-app-shell" data-page="dashboard">
    <div id="navMount"></div>
    <div class="page-wrap">
      <main class="page-main">
        <div class="container">
      <header class="header">
        <div>
          <h1>WhatsApp Web Dashboard</h1>
        </div>
      </header>

      <section class="grid">
        <div class="card">
          <h2>Connection</h2>
          <p id="serverStatus" class="status-note hidden">
            Server offline. Start the backend to reconnect.
          </p>
          <p>Status: <span id="statusText">NOT_INITIALIZED</span></p>
          <p>Client State: <span id="clientStateText">-</span></p>
          <p id="lastErrorText" class="error hidden"></p>
          <div id="clientDetailsBox" class="hidden" style="margin-top: 10px; padding: 10px; background: #f8f9fb; border-radius: 8px; border: 1px solid #e2e5eb; font-size: 13px;">
            <strong>Connected account</strong>
            <p style="margin: 6px 0 0;"><strong>Profile name:</strong> <span id="clientPushname">—</span></p>
            <p style="margin: 4px 0 0;"><strong>WID:</strong> <span id="clientWid" style="font-family: ui-monospace, monospace; word-break: break-all;">—</span></p>
            <p style="margin: 4px 0 0;"><strong>Phone:</strong> <span id="clientPhone">—</span></p>
          </div>
          <div class="button-row">
            <button id="initBtn" class="btn btn-primary">Connect / Reconnect</button>
            <button id="waLogoutBtn" class="btn btn-danger">Logout WhatsApp</button>
          </div>
          <div class="qr-box">
            <img id="qrImage" alt="QR Code" />
            <p id="qrHint">QR will appear here when required.</p>
          </div>
        </div>

        <div class="card">
          <h2>Send Message</h2>
          <div class="radio-group">
            <label class="form-check-label">
              <input type="radio" name="destType" value="individual" checked class="form-check-input" />
              Individual
            </label>
            <label class="form-check-label">
              <input type="radio" name="destType" value="group" class="form-check-input" />
              Group
            </label>
          </div>

          <div id="individualSection">
            <label class="form-label">
              To (E.164)
              <input type="text" id="toInput" placeholder="+94717177326" class="form-control" />
            </label>
          </div>

          <div id="groupSection" class="hidden">
            <label class="form-label">
              Group
              <select id="groupSelect" class="form-select">
                <option value="">Select group</option>
              </select>
            </label>
            <button id="refreshGroupsBtn" class="btn btn-secondary btn-sm">
              Refresh Groups
            </button>
          </div>

          <label class="form-label">
            Message
            <textarea id="messageInput" rows="4" class="form-control"></textarea>
          </label>
          <button id="sendBtn" class="btn btn-primary">Send Message</button>
          <p id="sendResult" class="info hidden"></p>
        </div>

        <div class="card">
          <h2>Send Poll</h2>
          <div class="radio-group">
            <label class="form-check-label">
              <input type="radio" name="pollDestType" value="individual" checked class="form-check-input" />
              Individual
            </label>
            <label class="form-check-label">
              <input type="radio" name="pollDestType" value="group" class="form-check-input" />
              Group
            </label>
          </div>

          <div id="pollIndividualSection">
            <label class="form-label">
              To (E.164)
              <input type="text" id="pollToInput" placeholder="+94717177326" class="form-control" />
            </label>
          </div>

          <div id="pollGroupSection" class="hidden">
            <label class="form-label">
              Group
              <select id="pollGroupSelect" class="form-select">
                <option value="">Select group</option>
              </select>
            </label>
            <button id="pollRefreshGroupsBtn" class="btn btn-secondary btn-sm">
              Refresh Groups
            </button>
          </div>

          <label class="form-label">
            Poll question
            <input type="text" id="pollQuestionInput" placeholder="What time works for the meeting?" class="form-control" />
          </label>

          <label class="form-label">Poll options</label>
          <div id="pollOptionsList"></div>
          <button id="pollAddOptionBtn" type="button" class="btn btn-secondary btn-sm" style="margin-top: 6px;">
            + Add option
          </button>

          <div class="radio-group" style="margin-top: 12px;">
            <label class="form-check-label">
              <input type="radio" name="pollAnswerType" value="single" checked class="form-check-input" />
              Single answer
            </label>
            <label class="form-check-label">
              <input type="radio" name="pollAnswerType" value="multiple" class="form-check-input" />
              Multiple answers
            </label>
          </div>

          <button id="pollSendBtn" class="btn btn-primary" style="margin-top: 12px;">Send Poll</button>
          <p id="pollSendResult" class="info hidden"></p>
        </div>
      </section>
        </div>
      </main>
      <div id="footerMount"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/nav.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
