<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Web - Reset password</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="has-app-shell" data-page="reset-password">
    <div id="navMount"></div>
    <div class="page-wrap">
      <main class="page-main">
        <div class="container">
      <h1>Reset password</h1>
      <form id="form" class="card">
        <label class="form-label">
          Email
          <input type="email" id="email" required autocomplete="email" class="form-control" />
        </label>
        <label class="form-label">
          Reset code
          <input type="text" id="otp" required maxlength="6" inputmode="numeric" pattern="[0-9]*" class="form-control" />
        </label>
        <label class="form-label">
          New password
          <input type="password" id="newPassword" required minlength="8" maxlength="72" autocomplete="new-password" class="form-control" />
        </label>
        <label class="form-label">
          Confirm new password
          <input type="password" id="confirmPassword" required minlength="8" maxlength="72" autocomplete="new-password" class="form-control" />
        </label>
        <button type="submit" class="btn btn-primary">Update password</button>
        <button type="button" class="btn btn-secondary mt-2" id="resendBtn">Resend code</button>
        <p id="err" class="error hidden"></p>
        <p id="ok" class="info hidden"></p>
        <p class="info" style="margin-top: 12px;">
          <a href="/forgot-password">Request a new code</a>
          ·
          <a href="/login">Back to login</a>
        </p>
      </form>
        </div>
      </main>
      <div id="footerMount"></div>
    </div>

    <script>
      const url = new URL(window.location.href);
      const presetEmail = url.searchParams.get("email");

      const form = document.getElementById("form");
      const emailInput = document.getElementById("email");
      const otpInput = document.getElementById("otp");
      const newPasswordInput = document.getElementById("newPassword");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const errEl = document.getElementById("err");
      const okEl = document.getElementById("ok");
      const resendBtn = document.getElementById("resendBtn");

      if (presetEmail) {
        emailInput.value = presetEmail;
      }

      const showErr = (text) => {
        errEl.textContent = text;
        errEl.classList.remove("hidden");
        okEl.classList.add("hidden");
      };

      resendBtn.addEventListener("click", async () => {
        errEl.classList.add("hidden");
        okEl.classList.add("hidden");
        const email = emailInput.value.trim();
        if (!email) {
          showErr("Enter your email first.");
          return;
        }
        const res = await fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showErr(data.error || "Could not resend");
          return;
        }
        okEl.textContent = data.message || "If an account exists, a code will be sent.";
        okEl.classList.remove("hidden");
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errEl.classList.add("hidden");
        okEl.classList.add("hidden");

        const email = emailInput.value.trim();
        const otp = otpInput.value.trim();
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (newPassword !== confirmPassword) {
          showErr("Passwords do not match");
          return;
        }
        if (newPassword.length < 8) {
          showErr("Password must be at least 8 characters");
          return;
        }

        const res = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, otp, newPassword, confirmPassword }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const msg =
            data.error ||
            (data.details && JSON.stringify(data.details)) ||
            "Reset failed";
          showErr(typeof msg === "string" ? msg : "Reset failed");
          return;
        }
        window.location.href = "/login";
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/nav.js"></script>
  </body>
</html>
